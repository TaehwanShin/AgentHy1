<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quick DB 탐색</title>
<style>
  :root { --bg: #ffffff; --text: #1f1e1b; --muted: #6d6a63; --code: #f5f4f0; --line: #dedbd3; --ok: #2e7d4f; --bad: #c0392b; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --text: #ece9e2; --muted: #a19d94; --code: #24231f; --line: #3a3833; --ok: #6cc28c; --bad: #ee7a6b; color-scheme: dark; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: var(--muted); }
  button { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--code); color: var(--text); cursor: pointer; }
  pre { margin: 12px 0 0; padding: 12px 14px; background: var(--code); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; word-break: break-all; font: 12.5px/1.55 Consolas, "D2Coding", monospace; }
</style>
<script>
  // quick.js 를 불러오기 전에 네트워크 호출을 기록한다. 주소 경로·방식·헤더 이름·본문의 키만 남기고 값은 남기지 않는다.
  window.__probeNet = [];
  (function () {
    function shapeOf(v, depth) {
      if (v === null || typeof v !== 'object') return typeof v;
      if (Array.isArray(v)) return 'array';
      return '{' + Object.keys(v).map(function (k) { return depth < 1 && v[k] && typeof v[k] === 'object' && !Array.isArray(v[k]) ? k + shapeOf(v[k], depth + 1) : k; }).join(',') + '}';
    }
    function describeBody(b) {
      if (b == null) return '';
      if (typeof b === 'string') { try { return 'JSON ' + shapeOf(JSON.parse(b), 0); } catch (e) { return 'text'; } }
      if (typeof FormData !== 'undefined' && b instanceof FormData) return 'FormData{' + Array.from(b.keys()).join(',') + '}';
      if (b instanceof URLSearchParams) return 'form{' + Array.from(b.keys()).join(',') + '}';
      return Object.prototype.toString.call(b);
    }
    function headerNames(h) {
      if (!h) return [];
      if (typeof Headers !== 'undefined' && h instanceof Headers) return Array.from(h.keys());
      return Array.isArray(h) ? h.map(function (p) { return p[0]; }) : Object.keys(h);
    }
    var origFetch = window.fetch;
    if (origFetch) {
      window.fetch = function (input, init) {
        try {
          window.__probeNet.push({
            via: 'fetch',
            method: (init && init.method) || (input && input.method) || 'GET',
            url: typeof input === 'string' ? input : (input && input.url) || String(input),
            headers: headerNames(init && init.headers),
            body: describeBody(init && init.body),
            credentials: init && init.credentials,
          });
        } catch (e) { /* 기록 실패는 무시 */ }
        return origFetch.apply(this, arguments);
      };
    }
    var X = window.XMLHttpRequest;
    if (X) {
      var open = X.prototype.open, send = X.prototype.send, setHeader = X.prototype.setRequestHeader;
      X.prototype.open = function (m, u) { this.__probe = { via: 'xhr', method: m, url: u, headers: [] }; return open.apply(this, arguments); };
      X.prototype.setRequestHeader = function (k) { if (this.__probe) this.__probe.headers.push(k); return setHeader.apply(this, arguments); };
      X.prototype.send = function (b) { if (this.__probe) { this.__probe.body = describeBody(b); this.__probe.credentials = this.withCredentials ? 'include' : ''; window.__probeNet.push(this.__probe); } return send.apply(this, arguments); };
    }
    if (window.WebSocket) {
      var WS = window.WebSocket;
      window.WebSocket = function (u, p) { window.__probeNet.push({ via: 'websocket', method: 'WS', url: u, headers: [], body: '' }); return p ? new WS(u, p) : new WS(u); };
      window.WebSocket.prototype = WS.prototype;
    }
  })();
</script>
<script src="/reserved/quick.js"></script>
</head>
<body>
<main>
  <h1>quick DB 탐색 — Claude 작업 브릿지</h1>
  <p>quick.js 가 제공하는 DB 함수 이름과 동작, 호출하는 서버 경로만 확인합니다. 헤더 값이나 기록 내용은 표시하지 않습니다.
     테스트용 컬렉션 <code>__bridge_probe</code> 에 기록 1건을 만들고 마지막에 지웁니다.</p>
  <button id="run" type="button">탐색 시작</button>
  <pre id="out">버튼을 누르면 결과가 여기에 표시됩니다. 끝나면 이 화면을 사진으로 보내 주세요.</pre>
</main>
<script>
(function () {
  'use strict';
  var out = document.getElementById('out');
  var lines = [];
  function log(s) { lines.push(s); out.textContent = lines.join('\n'); }

  function signature(fn) {
    var m = /^[^(=]*\(([^)]*)\)/.exec(Function.prototype.toString.call(fn));
    return '(' + (m ? m[1].replace(/\s+/g, ' ').slice(0, 60) : '?') + ')';
  }
  function membersOf(obj) {
    var names = [], seen = {}, o = obj;
    while (o && o !== Object.prototype && o !== Function.prototype) {
      Object.getOwnPropertyNames(o).forEach(function (n) {
        if (seen[n] || n === 'constructor') return;
        seen[n] = true;
        var d = Object.getOwnPropertyDescriptor(o, n);
        if (d && typeof d.value === 'function') names.push(n + signature(d.value));
        else if (d && d.get) names.push(n + ' (getter)');
        else names.push(n + ':' + typeof (d && d.value));
      });
      o = Object.getPrototypeOf(o);
    }
    return names.join(', ') || '(없음)';
  }
  function shape(v, depth) {
    depth = depth || 0;
    if (v === null) return 'null';
    if (v === undefined) return 'undefined';
    if (Array.isArray(v)) return 'array[' + v.length + ']' + (v.length && depth < 2 ? ' of ' + shape(v[0], depth + 1) : '');
    if (typeof v === 'object') {
      var keys = Object.keys(v);
      return '{' + keys.slice(0, 15).map(function (k) {
        return k + ':' + (depth < 2 && v[k] && typeof v[k] === 'object' ? shape(v[k], depth + 1) : typeof v[k]);
      }).join(', ') + (keys.length > 15 ? ', …' : '') + '}';
    }
    return typeof v;
  }
  function pathOnly(u) {
    try {
      var x = new URL(u, location.href);
      var q = Array.from(x.searchParams.keys());
      return (x.host === location.host ? '' : x.host) + x.pathname + (q.length ? '?' + q.join('&') : '');
    } catch (e) { return String(u); }
  }
  function netSince(i) {
    var n = window.__probeNet.slice(i);
    return n.length ? '\n      서버: ' + n.map(function (x) { return x.method + ' ' + pathOnly(x.url); }).join(' ; ') : '';
  }
  function withTimeout(p, ms) {
    return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error(ms / 1000 + '초 안에 응답 없음')); }, ms); })]);
  }
  async function step(label, fn) {
    var before = window.__probeNet.length;
    try {
      var r = await withTimeout(Promise.resolve().then(fn), 15000);
      log('[성공] ' + label + ' → ' + shape(r) + netSince(before));
      return { ok: true, value: r };
    } catch (e) {
      log('[오류] ' + label + ' → ' + ((e && e.message) || e) + netSince(before));
      return { ok: false };
    }
  }
  function findId(r) {
    if (!r || typeof r !== 'object' || Array.isArray(r)) return null;
    var targets = [['', r]];
    if (r.data && typeof r.data === 'object' && !Array.isArray(r.data)) targets.push(['data.', r.data]);
    if (r.record && typeof r.record === 'object') targets.push(['record.', r.record]);
    var keys = ['id', '_id', 'uuid', 'key', 'docId', 'recordId'];
    for (var t = 0; t < targets.length; t++) {
      for (var i = 0; i < keys.length; i++) if (targets[t][1][keys[i]] != null) return { path: targets[t][0] + keys[i], value: targets[t][1][keys[i]] };
    }
    return null;
  }
  var present = function (col, names) { return names.filter(function (n) { return typeof col[n] === 'function'; }); };

  async function run() {
    lines = [];
    window.__probeNet.length = 0;
    log('페이지: ' + location.pathname + '  · 브라우저: ' + navigator.userAgent.replace(/^.*?(Chrome|Edg|Firefox)\//, '$1/').split(' ')[0]);
    log('쿠키 이름: ' + (document.cookie.split(';').map(function (c) { return c.split('=')[0].trim(); }).filter(Boolean).join(', ') || '(없음)'));
    log('');
    log('== 1. quick 객체');
    if (typeof window.quick === 'undefined') { log('quick 이 없습니다. /reserved/quick.js 를 불러오지 못했습니다.'); return; }
    log('quick: ' + membersOf(window.quick));
    if (!window.quick.db) { log('quick.db 가 없습니다.'); return; }
    log('quick.db: ' + membersOf(window.quick.db));
    var colStep = await step("quick.db.collection('__bridge_probe')", function () { return window.quick.db.collection('__bridge_probe'); });
    if (!colStep.ok || !colStep.value) return;
    var col = colStep.value;
    log('컬렉션 객체: ' + membersOf(col));
    log('');

    log('== 2. 동작 시험');
    var created = await step("create({probe:'a', n:1, at})", function () { return col.create({ probe: 'a', n: 1, at: new Date().toISOString() }); });
    var id = created.ok ? findId(created.value) : null;
    log('      → 만든 기록의 id: ' + (id ? id.path + ' (' + typeof id.value + ')' : '찾지 못함'));

    var READ = ['find', 'findAll', 'list', 'getAll', 'all', 'query', 'where', 'select', 'search', 'filter', 'fetch', 'toArray', 'records'];
    var reads = present(col, READ);
    for (var i = 0; i < reads.length; i++) await step(reads[i] + '()', (function (n) { return function () { return col[n](); }; })(reads[i]));
    if (typeof col.find === 'function') await step("find({probe:'a'})", function () { return col.find({ probe: 'a' }); });
    if (typeof col.find === 'function') await step("find({where:{probe:'a'}})", function () { return col.find({ where: { probe: 'a' } }); });

    if (id) {
      var gets = present(col, ['get', 'findById', 'findOne', 'getById', 'read', 'doc']);
      for (var g = 0; g < gets.length; g++) await step(gets[g] + '(id)', (function (n) { return function () { return col[n](id.value); }; })(gets[g]));
      var updates = present(col, ['update', 'patch', 'updateOne', 'modify', 'save', 'set', 'put', 'upsert']);
      for (var u = 0; u < updates.length; u++) await step(updates[u] + "(id, {probe:'b'})", (function (n) { return function () { return col[n](id.value, { probe: 'b' }); }; })(updates[u]));
      if (reads.length) {
        var again = await step(reads[0] + '() 다시 읽기', function () { return col[reads[0]](); });
        if (again.ok) {
          var r = again.value;
          var items = Array.isArray(r) ? r : (r && (r.items || r.data || r.records || r.rows)) || [];
          var mine = items.filter(function (x) { var f = findId(x); return f && String(f.value) === String(id.value); })[0];
          var probeValue = mine ? (mine.probe !== undefined ? mine.probe : mine.data && mine.data.probe) : undefined;
          log('      → 수정 반영: ' + (!mine ? '해당 id 기록을 찾지 못함' : probeValue === 'b' ? '예' : '아니오'));
        }
      }
      var deletes = present(col, ['delete', 'remove', 'destroy', 'del', 'deleteOne']);
      for (var d = 0; d < deletes.length; d++) {
        var res = await step(deletes[d] + '(id)', (function (n) { return function () { return col[n](id.value); }; })(deletes[d]));
        if (res.ok) break;
      }
    } else {
      log('id 를 찾지 못해 수정/삭제 시험은 건너뜁니다.');
    }
    log('');

    log('== 3. 네트워크 호출 전체 (경로 · 헤더 이름 · 본문 키)');
    window.__probeNet.forEach(function (n) {
      log(n.via + ' ' + n.method + ' ' + pathOnly(n.url) + (n.headers && n.headers.length ? '  헤더:' + n.headers.join(',') : '') +
          (n.body ? '  본문:' + n.body : '') + (n.credentials ? '  credentials:' + n.credentials : ''));
    });
    log('');
    log('끝. 이 화면을 사진으로 보내 주세요.');
  }

  document.getElementById('run').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    run().catch(function (e) { log('예상하지 못한 오류: ' + ((e && e.message) || e)); }).then(function () { b.disabled = false; });
  });
})();
</script>
</body>
</html>
